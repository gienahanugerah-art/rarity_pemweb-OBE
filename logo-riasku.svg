<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Gradient Warna Pink ke Ungu Pastel -->
    <linearGradient id="pastelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC" /> <!-- Pink Pastel -->
      <stop offset="100%" stop-color="#E1BEE7" /> <!-- Ungu Pastel -->
    </linearGradient>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F48FB1" /> <!-- Soft Pink -->
      <stop offset="100%" stop-color="#CE93D8" /> <!-- Soft Purple -->
    </linearGradient>
  </defs>

  <!-- Background Lingkaran Pastel -->
  <circle cx="60" cy="60" r="45" fill="url(#pastelGrad)" />

  <!-- Ikon Kuas Makeup Simpel -->
  <g transform="translate(35, 30)">
    <!-- Gagang Kuas -->
    <path d="M 15 55 L 25 28 L 30 30 L 20 57 Z" fill="#9C27B0" opacity="0.6"/>
    <!-- Ring / Ferrule Kuas -->
    <rect x="23" y="22" width="9" height="7" rx="1" fill="#B0BEC5" />
    <!-- Bulu Kuas Makeup -->
    <path d="M 23 22 C 20 10, 25 5, 27.5 5 C 30 5, 35 10, 32 22 Z" fill="url(#brushGrad)" />
  </g>

  <!-- Teks Brand RiasKu -->
  <text x="120" y="70" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="42" fill="#4A148C">
    Rias<tspan fill="#EC407A">Ku</tspan>
  </text>
  <text x="123" y="90" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="12" fill="#8E24AA" letter-spacing="2">
    MAKEUP ARTIST
  </text>
</svg>
