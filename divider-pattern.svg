<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Gradien Ungu Ke Pink Pastel -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E1BEE7" stop-opacity="0.2"/>
      <stop offset="15%" stop-color="#CE93D8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F48FB1" stop-opacity="1"/>
      <stop offset="85%" stop-color="#CE93D8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E1BEE7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Garis Pembatas Utama -->
  <path d="M 0 30 Q 300 38 600 30 T 1200 30" fill="none" stroke="url(#dividerGrad)" stroke-width="2"/>
  <path d="M 0 30 Q 300 22 600 30 T 1200 30" fill="none" stroke="url(#dividerGrad)" stroke-width="1" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Ornamen Tengah (Sparkle/Bintang Rias) -->
  <g transform="translate(600, 30)">
    <!-- Bintang Utama -->
    <path d="M 0 -12 Q 3 -3 12 0 Q 3 3 0 12 Q -3 3 -12 0 Q -3 -3 0 -12 Z" fill="#EC407A"/>
    <!-- Lingkaran Samping -->
    <circle cx="-25" cy="0" r="3" fill="#CE93D8"/>
    <circle cx="25" cy="0" r="3" fill="#CE93D8"/>
    <circle cx="-40" cy="0" r="1.5" fill="#F48FB1"/>
    <circle cx="40" cy="0" r="1.5" fill="#F48FB1"/>
  </g>
</svg>
