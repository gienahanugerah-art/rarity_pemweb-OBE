<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <defs>
    <!-- Gradien Perpaduan Pink Pastel & Ungu Pastel -->
    <linearGradient id="pastelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" /> <!-- Pink Soft -->
      <stop offset="50%" stop-color="#c084fc" /> <!-- Ungu Pastel -->
      <stop offset="100%" stop-color="#a855f7" /> <!-- Purple Accent -->
    </linearGradient>

    <linearGradient id="softBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e9d5ff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Shadow Halus Pastel -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#c084fc" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- ILUSTRASI CAMPURAN: BLUSH, LIPPIES & BRUSH -->
    <g filter="url(#softShadow)">
      <!-- 1. Compact Powder / Blush (Bentuk Lingkaran Ungu Pastel) -->
      <circle cx="65" cy="80" r="42" fill="#faf5ff" stroke="#c084fc" stroke-width="4" />
      <circle cx="65" cy="80" r="32" fill="#f472b6" opacity="0.85" /> <!-- Isian Blush Pink -->
      <!-- Highlight kilauan pada blush -->
      <path d="M 50 68 Q 65 58 80 68" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />

      <!-- 2. Lippies / Lipstik Pastel (Di sebelah kanan blush) -->
      <rect x="92" y="75" width="22" height="40" rx="4" fill="#a855f7" /> <!-- Tabung Bawah Ungu -->
      <rect x="95" y="65" width="16" height="10" fill="#e9d5ff" /> <!-- Ring Metalik -->
      <!-- Ujung Lipstik Pink -->
      <path d="M 95 65 L 95 48 C 95 42 111 38 111 48 L 111 65 Z" fill="#f472b6" /> 

      <!-- 3. Brush Makeup Miring / Diagonal -->
      <g transform="rotate(-28 55 55)">
        <!-- Gagang Brush -->
        <rect x="50" y="20" width="10" height="75" rx="5" fill="#3b0764" />
        <!-- Ring/Ferrule Brush -->
        <rect x="49" y="15" width="12" height="14" rx="2" fill="#cbd5e1" />
        <!-- Bulu Brush Ungu-Pink -->
        <path d="M 48 15 C 48 -2 62 -2 62 15 Z" fill="#c084fc" />
        <path d="M 51 5 C 51 -2 59 -2 59 5 Z" fill="#f472b6" /> <!-- Tip Brush Pink -->
      </g>

      <!-- Sparkles / Elemen Bintang Kecil -->
      <path d="M 22 40 Q 22 30 12 30 Q 22 30 22 20 Q 22 30 32 30 Q 22 30 22 40 Z" fill="#f472b6" />
      <path d="M 115 28 Q 115 22 109 22 Q 115 22 115 16 Q 115 22 121 22 Q 115 22 115 28 Z" fill="#c084fc" />
    </g>

    <!-- TEKS SINGKATAN BESAR: GFYM -->
    <text x="155" y="75" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="64" 
          fill="url(#pastelGrad)" 
          letter-spacing="2">GFYM</text>

    <!-- Garis Pembatas Pastel -->
    <line x1="158" y1="88" x2="335" y2="88" stroke="#e9d5ff" stroke-width="3" stroke-linecap="round" />

    <!-- TEKS KEPANJANGAN: GO FIND YOUR MUA -->
    <text x="158" y="112" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="700" 
          font-size="18.5" 
          fill="#6b21a8" 
          letter-spacing="3.5">GO FIND YOUR MUA</text>
  </g>
</svg>
